name: Build

# Linux packaged build, called from ci.yml. The fork is verified on Linux only and
# ships no releases, so there is no signing, no publishing and no other platform.
on:
  workflow_call:
    inputs:
      upload_artifacts:
        required: false
        type: boolean
        default: false
        description: 'Whether to upload build artifacts'

permissions:
  contents: read

jobs:
  build:
    name: Package (linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.11.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build:linux

      - name: Verify packaged sherpa natives
        run: node apps/desktop/scripts/check-packaged-sherpa.cjs linux

      - name: Upload build artifacts
        if: inputs.upload_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          retention-days: 3
          if-no-files-found: error
