name: Build Extension

# Browser extension build, called from ci.yml.
on:
  workflow_call:
    inputs:
      upload_artifacts:
        required: false
        type: boolean
        default: false
        description: 'Whether to upload build artifacts'

permissions:
  contents: read

jobs:
  build:
    name: Build (extension)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare extension types
        run: bun run --cwd apps/extension prepare:wxt

      - name: Check extension
        run: bun run --cwd apps/extension check

      - name: Test extension
        run: bun run --cwd apps/extension test

      - name: Typecheck extension
        run: bun run --cwd apps/extension compile

      - name: Build extension
        run: bun run --cwd apps/extension build

      - name: Build extension zip
        run: bun run --cwd apps/extension zip

      - name: Upload extension artifacts
        if: inputs.upload_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: dist-extension
          path: apps/extension/.output/*.zip
          # .output is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
