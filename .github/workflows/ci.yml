name: CI

# Pull-request gate for the fork. Nothing here publishes anything.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, tests, deps
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # The ownership ratchet reads the baseline from the PR target revision.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, locale check and typecheck
        run: bun run check

      # Match the packaged job: CLI characterization requires offline namespaces.
      - name: Enable user namespaces for offline CLI tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tests
        run: bun run test

      - name: Effect port ratchet
        run: bun run port:check

      - name: Dependency catalog check
        run: bun run deps:check

  build:
    name: Linux packaged build
    uses: ./.github/workflows/build.yml
    with:
      upload_artifacts: true

  extension:
    name: Extension build
    uses: ./.github/workflows/extension-build.yml
    with:
      upload_artifacts: true
